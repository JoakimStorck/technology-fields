# Manual edge rules override or supplement the AST graph.
# sign: "+" or "-"
# include_in_figure: true means the edge may enter the compact manuscript graph.
[[manual_edges]]
from = "technology_transition"
to = "reinstatement_pressure"
sign = "+"
mechanism = "Technology maturity governs the timing of displacement and the creation of surviving new task mass."
include_in_figure = true

[[manual_edges]]
from = "reinstatement_pressure"
to = "occupational_absorption"
sign = "+"
mechanism = "Unbound task mass creates binding pressure."
include_in_figure = true

[[manual_edges]]
from = "occupational_absorption"
to = "reinstatement_pressure"
sign = "-"
mechanism = "Binding drains the unbound stock."
include_in_figure = true

[[manual_edges]]
from = "occupational_absorption"
to = "occupational_revaluation"
sign = "+"
mechanism = "Bound new work changes occupational value."
include_in_figure = true

[[manual_edges]]
from = "occupational_revaluation"
to = "labour_reallocation"
sign = "+"
mechanism = "Occupational value redirects labour."
include_in_figure = true

[[manual_edges]]
from = "price_feedback"
to = "technology_transition"
sign = "+"
mechanism = "The price field affects adoption and subsequent displacement."
include_in_figure = false

[[manual_edges]]
from = "occupational_absorption"
to = "occupation_birth"
sign = "+"
mechanism = "Unserved fit gaps and accumulated task mass can trigger occupation birth."
include_in_figure = false

[[manual_edges]]
from = "occupation_birth"
to = "occupational_absorption"
sign = "+"
mechanism = "New occupations add fit and absorptive channels."
include_in_figure = false

# ---------------------------------------------------------------------------
# Stock-and-flow figure (manuscript Figure 2 replacement). Hand-declared,
# code-audited: every edge lists concept-level witnesses that must exist with
# AST support in the extracted graph, or carries identity = true with the
# defining mechanism. The emitter fails loudly on an unwitnessed edge.
# kinds: stock (bold box), flow (ellipse), regulator (box), source (plain),
# aux (box).
# ---------------------------------------------------------------------------
[stockflow]
name = "dynamic_stockflow"

[[stockflow.nodes]]
id = "tech"
kind = "source"
label = "Technology maturation\\nA_K(t)"

[[stockflow.nodes]]
id = "disp"
kind = "flow"
label = "Displacement\\n∂tΓ^D"

[[stockflow.nodes]]
id = "seed"
kind = "flow"
label = "Survival-gated\\nseeding s(r,t)"

[[stockflow.nodes]]
id = "U"
kind = "stock"
label = "Unbound task stock\\nU(r,t)"

[[stockflow.nodes]]
id = "bind"
kind = "flow"
label = "Binding\\ni_o(r,t)"

[[stockflow.nodes]]
id = "B"
kind = "stock"
label = "Occupation-bound\\nnew work r_o(t)"

[[stockflow.nodes]]
id = "cap"
kind = "regulator"
label = "Absorptive capacity\\nc_o = M_o/theta_abs"

[[stockflow.nodes]]
id = "M0"
kind = "source"
label = "Pre-shock size\\nM_o(0)"

[[stockflow.nodes]]
id = "match"
kind = "regulator"
label = "Match readiness\\ne_o(r), frozen"

[[stockflow.nodes]]
id = "value"
kind = "aux"
label = "Occupational value\\nW_o(t)"

[[stockflow.nodes]]
id = "L"
kind = "aux"
label = "Population\\nL_o(t)"

[[stockflow.edges]]
from = "tech"
to = "disp"
sign = "+"
audit = ["technology_maturity->automation_intensity", "automation_intensity->displaced_old_work"]
mechanism = "Maturation opens the gate and displaces old work."

[[stockflow.edges]]
from = "disp"
to = "seed"
sign = "+"
audit = ["displaced_old_work->seeding_flow", "surviving_new_task_share->seeding_flow"]
mechanism = "Reinstatement seeds at the displacement rate, gated by survival."

[[stockflow.edges]]
from = "seed"
to = "U"
sign = "+"
audit = ["seeding_flow->unbound_task_stock"]
mechanism = "Seeded mass fills the unbound stock."

[[stockflow.edges]]
from = "U"
to = "bind"
sign = "+"
audit = ["unbound_task_stock->available_unbound_mass", "available_unbound_mass->binding_claim", "binding_claim->binding_allocation", "binding_allocation->binding_flow"]
mechanism = "Unbound mass is offered and claimed."

[[stockflow.edges]]
from = "bind"
to = "U"
sign = "-"
audit = ["binding_flow->unbound_task_stock"]
mechanism = "Binding drains the stock; the residue cascades."

[[stockflow.edges]]
from = "bind"
to = "B"
sign = "+"
audit = ["binding_flow->occupation_bound_work", "binding_allocation->occupation_bound_work"]
mechanism = "Bound mass accumulates as occupation-bound new work."

[[stockflow.edges]]
from = "M0"
to = "cap"
sign = "+"
audit = ["initial_task_mass->absorptive_capacity"]
mechanism = "Capacity is proportional to task mass."

[[stockflow.edges]]
from = "B"
to = "cap"
sign = "+"
audit = ["occupation_bound_work->absorptive_capacity"]
mechanism = "Bound mass grows the size margin: size learns."

[[stockflow.edges]]
from = "cap"
to = "bind"
sign = "+"
audit = ["absorptive_capacity->binding_flow"]
mechanism = "The size-limited rate cap; the saturated residue is re-offered."

[[stockflow.edges]]
from = "match"
to = "bind"
sign = "+"
audit = ["task_occupation_fit->binding_claim"]
mechanism = "Match allocates: claims are FIT^beta_m shares."

[[stockflow.edges]]
from = "B"
to = "value"
sign = "+"
audit = ["occupation_bound_work->occupational_value"]
mechanism = "Bound new work carries value."

[[stockflow.edges]]
from = "value"
to = "L"
sign = "+"
audit = ["occupational_value->target_population", "target_population->occupational_population"]
mechanism = "The mobility re-sort follows value."

[[stockflow.edges]]
from = "L"
to = "value"
sign = "-"
identity = true
mechanism = "Crowding by definition of the density: n = sum L_o b_o + B and marginal value beta Pi n^(beta-1)."
