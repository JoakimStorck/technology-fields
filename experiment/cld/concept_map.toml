# ---------------------------------------------------------------------------
# Stock-and-flow figure (manuscript Figure 2), in the notation of Forrester,
# Industrial Dynamics (1961), ch. 8: levels are rectangles (integrations),
# rates are valves in the flow channels, auxiliaries circles, parameters
# underlined names, sources clouds outside the accounting; solid lines are
# material (task-mass) flows, double lines personnel flows, dashed lines
# information with take-off circles at the source. Hand-declared,
# code-audited: every edge carries AST witnesses, or identity = true with
# its defining mechanism, or parameter = true (a constant is a declaration,
# not a dataflow claim). The emitter fails loudly otherwise.
# ---------------------------------------------------------------------------
[[figures]]
name = "dynamic_stockflow"
[[figures.nodes]]
id = "old"
kind = "source"
label = "displaced\nold work"

[[figures.nodes]]
id = "seed"
kind = "rate"
label = "seeding ζ̇"

[[figures.nodes]]
id = "U"
kind = "level"
label = "Unbound task stock\nU(r,t)"

[[figures.nodes]]
id = "bind"
kind = "rate"
label = "binding ι_o"

[[figures.nodes]]
id = "B"
kind = "level"
label = "Occupation-bound\nnew work r_o(t)"

[[figures.nodes]]
id = "AK"
kind = "aux"
label = "A_K(t)"

[[figures.nodes]]
id = "disp"
kind = "aux"
label = "∂_tΔΓ^D"

[[figures.nodes]]
id = "gate"
kind = "aux"
label = "1−a(r,t)"

[[figures.nodes]]
id = "W"
kind = "aux"
label = "W_o(t)"

[[figures.nodes]]
id = "L"
kind = "level"
label = "Population\nL_o(t)"

[[figures.nodes]]
id = "occ"
kind = "source"
label = "other\noccupations"

[[figures.nodes]]
id = "resort"
kind = "rate"
label = "re-sort"

[[figures.nodes]]
id = "gamma"
kind = "param"
label = "γ"

[[figures.nodes]]
id = "theta_abs"
kind = "param"
label = "θ_abs"

[[figures.nodes]]
id = "M0"
kind = "param"
label = "M_o(0)"

[[figures.nodes]]
id = "eo"
kind = "param"
label = "e_o(r), β_m"

[[figures.nodes]]
id = "theta_L"
kind = "param"
label = "θ_L"

# -- material channel: old work -> seeding -> U -> binding -> B --
[[figures.edges]]
from = "old"
to = "seed"
channel = "material"
identity = true
mechanism = "Source outside the accounting (Forrester 8.4); seeded mass is created."

[[figures.edges]]
from = "seed"
to = "U"
channel = "material"
audit = ["seeding_flow->unbound_task_stock"]
mechanism = "Seeded mass fills the unbound stock."

[[figures.edges]]
from = "U"
to = "bind"
channel = "material"
audit = ["binding_flow->unbound_task_stock"]
mechanism = "Binding drains the stock; the saturated residue stays and cascades."

[[figures.edges]]
from = "bind"
to = "B"
channel = "material"
audit = ["binding_flow->occupation_bound_work"]
mechanism = "Bound mass accumulates as occupation-bound new work."

# -- personnel channel: the conserved re-sort --
[[figures.edges]]
from = "occ"
to = "resort"
channel = "personnel"
identity = true
mechanism = "Population is conserved; the flow is between occupations."

[[figures.edges]]
from = "resort"
to = "L"
channel = "personnel"
audit = ["target_population->occupational_population"]
mechanism = "The population relaxes toward the value-sorted target at tempo theta_L."

# -- information channel --
[[figures.edges]]
from = "AK"
to = "disp"
channel = "information"
audit = ["technology_maturity->automation_intensity", "automation_intensity->displaced_old_work"]
mechanism = "Maturation displaces old work through the gate."

[[figures.edges]]
from = "AK"
to = "gate"
channel = "information"
audit = ["technology_maturity->automation_intensity"]
mechanism = "The takeover gate opens with maturity."

[[figures.edges]]
from = "disp"
to = "seed"
channel = "information"
audit = ["displaced_old_work->seeding_flow"]
mechanism = "Seeding follows the rate of displacement."

[[figures.edges]]
from = "gate"
to = "seed"
channel = "information"
audit = ["surviving_new_task_share->seeding_flow"]
mechanism = "Only the surviving share is seeded."

[[figures.edges]]
from = "gamma"
to = "seed"
channel = "information"
audit = ["seeded_fraction->seeding_flow"]
mechanism = "Seeded fraction of displaced mass."

[[figures.edges]]
from = "U"
to = "bind"
channel = "information"
audit = ["unbound_task_stock->available_unbound_mass", "available_unbound_mass->binding_claim"]
mechanism = "Claims are shares of the offered stock."

[[figures.edges]]
from = "B"
to = "bind"
channel = "information"
audit = ["occupation_bound_work->absorptive_capacity", "absorptive_capacity->binding_flow"]
mechanism = "Bound mass grows the size margin: size learns."

[[figures.edges]]
from = "M0"
to = "bind"
channel = "information"
parameter = true
mechanism = "Pre-shock size in M_o = M_o(0) + r_o, eq. (cap)."

[[figures.edges]]
from = "theta_abs"
to = "bind"
channel = "information"
parameter = true
mechanism = "Absorption timescale of the capacity law."

[[figures.edges]]
from = "eo"
to = "bind"
channel = "information"
audit = ["task_occupation_fit->binding_claim"]
mechanism = "Frozen match readiness allocates: claims are FIT^beta_m shares."

[[figures.edges]]
from = "B"
to = "W"
channel = "information"
audit = ["occupation_bound_work->occupational_value"]
mechanism = "Bound new work carries value."

[[figures.edges]]
from = "L"
to = "W"
channel = "information"
identity = true
mechanism = "Crowding by the density definition n = sum L_o b_o + B."

[[figures.edges]]
from = "W"
to = "resort"
channel = "information"
audit = ["occupational_value->target_population"]
mechanism = "The mobility target follows value."

[[figures.edges]]
from = "theta_L"
to = "resort"
channel = "information"
parameter = true
mechanism = "Mobility timescale of the re-sort."
