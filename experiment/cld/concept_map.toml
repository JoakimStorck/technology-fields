# Manual edge rules override or supplement the AST graph.
# sign: "+" or "-"
# include_in_figure: true means the edge may enter the compact manuscript graph.
[[manual_edges]]
from = "technology_transition"
to = "reinstatement_pressure"
sign = "+"
mechanism = "Technology maturity governs the timing of displacement and the creation of surviving new task mass."
include_in_figure = true

[[manual_edges]]
from = "reinstatement_pressure"
to = "occupational_absorption"
sign = "+"
mechanism = "Unbound task mass creates binding pressure."
include_in_figure = true

[[manual_edges]]
from = "occupational_absorption"
to = "reinstatement_pressure"
sign = "-"
mechanism = "Binding drains the unbound stock."
include_in_figure = true

[[manual_edges]]
from = "occupational_absorption"
to = "occupational_revaluation"
sign = "+"
mechanism = "Bound new work changes occupational value."
include_in_figure = true

[[manual_edges]]
from = "occupational_revaluation"
to = "labour_reallocation"
sign = "+"
mechanism = "Occupational value redirects labour."
include_in_figure = true

[[manual_edges]]
from = "labour_reallocation"
to = "occupational_absorption"
sign = "+"
mechanism = "Occupational population changes absorptive capacity."
include_in_figure = true

[[manual_edges]]
from = "price_feedback"
to = "technology_transition"
sign = "+"
mechanism = "The price field affects adoption and subsequent displacement."
include_in_figure = false

[[manual_edges]]
from = "occupational_absorption"
to = "occupation_birth"
sign = "+"
mechanism = "Unserved fit gaps and accumulated task mass can trigger occupation birth."
include_in_figure = false

[[manual_edges]]
from = "occupation_birth"
to = "occupational_absorption"
sign = "+"
mechanism = "New occupations add fit and absorptive channels."
include_in_figure = false
